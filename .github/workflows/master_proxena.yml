# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - proxena

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        # Use build:compile (tsc + copy SQL files) — do NOT run migrations here.
        # Migrations run once manually via: az webapp ssh / npm run migrate
        run: npm run build:compile

      - name: Prune dev dependencies before packaging
        run: npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Only ship what Azure needs: compiled output, prod node_modules, package files
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json
            web.config

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_47E6539CF8AB4502BBE8BD7497857CC6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F7D85019803949E3A2C0FB9954035054 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_41288EE720F8406A83D34D307DCB7EF9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'proxena'
          slot-name: 'Production'
          package: .
