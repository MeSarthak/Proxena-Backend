services:
  postgres:
    image: postgres:16-alpine
    container_name: proxena_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: proxena
      POSTGRES_USER: proxena_user
      POSTGRES_PASSWORD: proxena_pass
    ports:
      - "5432:5432"
    volumes:
      - proxena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxena_user -d proxena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proxena_pgdata:
